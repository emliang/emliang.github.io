<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">From a prediction to a feasible output</title>
<desc id="desc">A triangular feasible set. An outside prediction is projected along a perpendicular segment onto its boundary; another feasible output lies inside the triangle.</desc>
<metadata>Feasible set is the unit triangle x ≥ 0, y ≥ 0, x + y ≤ 1. Display transform: X = 310 + 390x, Y = 475 − 390y. Prediction display point (875,165) projects to (632.5,407.5).</metadata>
<defs><marker id="project-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#9b654e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .label {font-family:Arial,Helvetica,sans-serif;font-size:27px;fill:#65767a}
  .symbol {font-family:Georgia,'Times New Roman',serif;font-size:38px;fill:#24363a;font-style:italic}
  .eyebrow {font-family:Arial,Helvetica,sans-serif;font-size:19px;letter-spacing:3px;fill:#65767a}
</style>
<rect width="1200" height="630" fill="#fbfaf8"/>
<text class="eyebrow" x="70" y="65">FEASIBILITY</text>
<path d="M310 475 L700 475 L310 85 Z" fill="#e9f3f0"/>
<g stroke="#b9cfca" stroke-width="1.2" opacity=".75">
  <path d="M388 475 V163 M466 475 V241 M544 475 V319 M622 475 V397"/>
  <path d="M310 397 H622 M310 319 H544 M310 241 H466 M310 163 H388"/>
</g>
<path d="M310 475 L700 475 L310 85 Z" fill="none" stroke="#2c6d77" stroke-width="3" stroke-linejoin="round"/>
<path d="M294 475 H732 M310 491 V68" fill="none" stroke="#9daaad" stroke-width="1.4"/>
<path d="M865 175 L643 397" fill="none" stroke="#9b654e" stroke-width="2.6" stroke-linecap="round" marker-end="url(#project-arrow)"/>
<path d="M617 392 L632.5 376.5 L648 392" fill="none" stroke="#9b654e" stroke-width="1.6"/>
<circle cx="875" cy="165" r="9" fill="#fbfaf8" stroke="#9b654e" stroke-width="3"/>
<circle cx="632.5" cy="407.5" r="8" fill="#2c6d77" stroke="#fbfaf8" stroke-width="3"/>
<text class="label" x="906" y="174">Prediction</text>
<text class="label" x="748" y="345" fill="#9b654e">Project</text>
<text class="label" x="684" y="414">Feasible output</text>
<text class="symbol" x="386" y="286" fill="#2c6d77">K</text>
<text class="label" x="500" y="551" text-anchor="middle">A feasible set</text>
</svg>