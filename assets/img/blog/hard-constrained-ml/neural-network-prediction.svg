<svg xmlns="http://www.w3.org/2000/svg" width="480" height="404" viewBox="0 0 480 404" role="img" aria-labelledby="title desc">
<title id="title">A feedforward neural network maps a feature vector to a prediction</title>
<desc id="desc">A small multilayer perceptron is expanded into its actual computation. Four input features enter three affine weighted-sum units, each followed by a ReLU activation, before two affine readout units form the output vector. Bars represent feature values, dark sum nodes are learned affine operations, and the plotted kink denotes ReLU. The copper route helps follow one contribution; all connections remain active. Values come from a hand-specified toy network, not training or experimental data. This unconstrained network does not itself encode feasibility.</desc>
