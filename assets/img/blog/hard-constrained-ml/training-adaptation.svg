<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
<title id="title">Train the update or constraint mechanism</title>
<desc id="desc">The next sampler state feeds a readout, map or correction before the training loss is evaluated. Solid teal arrows show that forward computation. Dashed copper arrows fit model parameters theta and, when trainable, the output operation&#x27;s parameters. Training can accompany guidance, correction or feasible coordinates; it is not a separate mutually exclusive sampler family. These are schematic paths, not a training result.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
