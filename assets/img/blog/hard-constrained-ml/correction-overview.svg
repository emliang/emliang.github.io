<svg xmlns="http://www.w3.org/2000/svg" width="480" height="132" viewBox="0 0 480 132" role="img" aria-labelledby="title desc">
<title id="title">Correction</title>
<desc id="desc">Apply a correction to a specified state, output estimate or final sample. Intermediate corrections need a method-specific connection to continued sampling.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="132" fill="#ffffff"/>
<metadata>{&quot;scope&quot;: &quot;classification schematic; algorithm details in companion repository&quot;}</metadata>
<rect x="16" y="34" width="124" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="78" y="74" font-size="24" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Candidate</text>
<rect x="189" y="34" width="136" height="64" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="257.0" y="58" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Correct</text>
<text x="257.0" y="90" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">or solve</text>
<rect x="374" y="34" width="100" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="424" y="74" font-size="22" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Output</text>
<line x1="148" y1="66" x2="181" y2="66" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="333" y1="66" x2="366" y2="66" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
</svg>
