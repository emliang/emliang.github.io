<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
<title id="title">Iterative generation overview</title>
<desc id="desc">A prior noise draw is transformed by repeated model-based numerical updates into an output. Constraint mechanisms may modify the representation, sampling dynamics, or output handling. This is a classification-level overview, not an algorithm.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="200" fill="#ffffff"/>
<rect x="16" y="30" width="102" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="67.0" y="55" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">z</text>
<text x="67.0" y="86" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">noise</text>
<rect x="175" y="30" width="191" height="64" rx="9" fill="#e9f3f0" stroke="#9bbeb7" stroke-width="2"/>
<text x="270.5" y="54" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Sampling</text>
<text x="270.5" y="86" font-size="20" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">iterative steps</text>
<line x1="125" y1="62" x2="167" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="374" y1="62" x2="412" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="441" y="71" font-size="30" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">y</text>
<text x="270" y="130" font-size="23" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">model + numerical update</text>
<text x="240" y="179" font-size="22" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Constraints can shape the process or its output.</text>
</svg>
