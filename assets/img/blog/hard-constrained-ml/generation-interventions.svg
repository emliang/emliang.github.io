<svg xmlns="http://www.w3.org/2000/svg" width="480" height="134" viewBox="0 0 480 134" role="img" aria-labelledby="title desc">
<title id="title">Guidance, correction, and search</title>
<desc id="desc">Constraint information can steer an update, repair a specified candidate, or select among competing proposals. These are alternatives that can be combined, not three mandatory sequential operations. The object, timing and accuracy of the operation determine the final-output claim.</desc>
