<metadata>{&quot;scope&quot;: &quot;classification schematic; algorithm details in companion repository&quot;}</metadata>
<text x="62" y="84" font-size="24" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">State</text>
