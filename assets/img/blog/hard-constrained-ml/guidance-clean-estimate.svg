<svg xmlns="http://www.w3.org/2000/svg" width="480" height="522" viewBox="0 0 480 522" role="img" aria-labelledby="title desc">
<title id="title">Forward universal guidance changes the noise prediction</title>
<desc id="desc">Representative forward guidance from Bansal et al., section 3.1. The noise prediction and noisy state define a clean estimate; a task loss on that estimate is differentiated with respect to the noisy state. The scaled gradient modifies the predicted noise before the diffusion sampling update. Theta is frozen. Optional backward guidance and self-recurrence from the full algorithm are omitted.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="522" fill="#ffffff"/>
<metadata>{&quot;scope&quot;: &quot;forward guidance only; no claim of exact feasibility&quot;, &quot;source&quot;: &quot;https://arxiv.org/html/2302.07121v1#S3.SS1&quot;}</metadata>
<text x="240" y="27" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Forward universal guidance</text>
<rect x="16" y="55" width="116" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="74.0" y="80" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">x<tspan dy="6.72" font-size="19.6">t</tspan><tspan dy="-6.72">&#8203;</tspan></text>
<text x="74.0" y="111" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">noisy state</text>
<rect x="200" y="55" width="264" height="64" rx="9" fill="#24363a" stroke="#24363a" stroke-width="2"/>
<text x="332.0" y="79" font-size="25" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Noise prediction</text>
<text x="332.0" y="111" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">ε<tspan dy="4.8" font-size="14.0">θ</tspan><tspan dy="-4.8">&#8203;</tspan>(x<tspan dy="4.8" font-size="14.0">t</tspan><tspan dy="-4.8">&#8203;</tspan>, t)</text>
<line x1="140" y1="87" x2="192" y2="87" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="16" y="163" width="229" height="64" rx="9" fill="#e9f3f0" stroke="#9bbeb7" stroke-width="2"/>
<text x="130.5" y="187" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Clean estimate</text>
<text x="130.5" y="219" font-size="20" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">ŷ = E<tspan dy="4.8" font-size="14.0">θ</tspan><tspan dy="-4.8">&#8203;</tspan>(x<tspan dy="4.8" font-size="14.0">t</tspan><tspan dy="-4.8">&#8203;</tspan>, t)</text>
<path d="M74 126 V155" fill="none" stroke="#2c6d77" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M332 127 V142 H196 V155" fill="none" stroke="#2c6d77" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="311" y="163" width="153" height="64" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="387.5" y="187" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Task loss</text>
<text x="387.5" y="219" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">L(ŷ)</text>
<line x1="253" y1="195" x2="303" y2="195" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="100" y="277" width="364" height="72" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="282.0" y="301" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Modify the predicted noise</text>
<text x="282.0" y="333" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">ε<tspan dy="4.8" font-size="14.0">g</tspan><tspan dy="-4.8">&#8203;</tspan> = ε<tspan dy="4.8" font-size="14.0">θ</tspan><tspan dy="-4.8">&#8203;</tspan> + s(t) g<tspan dy="4.8" font-size="14.0">t</tspan><tspan dy="-4.8">&#8203;</tspan></text>
<path d="M388 235 V269" fill="none" stroke="#9b654e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#back)"/>
<text x="243" y="262" font-size="22" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">g<tspan dy="5.28" font-size="15.4">t</tspan><tspan dy="-5.28">&#8203;</tspan> = ∂L / ∂x<tspan dy="5.28" font-size="15.4">t</tspan><tspan dy="-5.28">&#8203;</tspan></text>
<text x="46" y="322" font-size="27" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="end">ε<tspan dy="6.48" font-size="18.9">θ</tspan><tspan dy="-6.48">&#8203;</tspan></text>
<line x1="53" y1="313" x2="92" y2="313" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="74" y="400" width="280" height="64" rx="9" fill="#e9f3f0" stroke="#9bbeb7" stroke-width="2"/>
<text x="214.0" y="424" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Diffusion sampler</text>
<text x="214.0" y="456" font-size="20" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">S(x<tspan dy="4.8" font-size="14.0">t</tspan><tspan dy="-4.8">&#8203;</tspan>, ε<tspan dy="4.8" font-size="14.0">g</tspan><tspan dy="-4.8">&#8203;</tspan>, t)</text>
<line x1="224" y1="357" x2="224" y2="392" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M16 87 H5 V432 H66" fill="none" stroke="#2c6d77" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="398" y="441" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif">x<tspan dy="6.72" font-size="19.6">t−1</tspan><tspan dy="-6.72">&#8203;</tspan></text>
<line x1="361" y1="432" x2="389" y2="432" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="240" y="500" font-size="21" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">θ is fixed · differentiate with respect to x<tspan dy="5.04" font-size="14.7">t</tspan><tspan dy="-5.04">&#8203;</tspan></text>
</svg>
