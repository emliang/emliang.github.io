<svg xmlns="http://www.w3.org/2000/svg" width="480" height="134" viewBox="0 0 480 134" role="img" aria-labelledby="title desc">
<title id="title">Constraint parameterization</title>
<desc id="desc">Generate valid reference coordinates u in U, then apply a decoder D whose image lies in the feasible set K. The map determines validity and coverage. This differs from intrinsic geometric dynamics.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c6d77"/></marker></defs>
<metadata>{&quot;scope&quot;: &quot;classification schematic; algorithm details in companion repository&quot;}</metadata>
<text x="62" y="84" font-size="26" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-style="italic">u ∈ U</text>
<path d="M119 76H156" fill="none" stroke="#2c6d77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="168" y="38" width="170" height="76" rx="9" fill="#eef2f7" stroke="#526e9b" stroke-opacity=".45" stroke-width="1.5"/>
<text x="253" y="65" font-size="24" fill="#526e9b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Decode</text>
<text x="253" y="96" font-size="25" fill="#526e9b" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-style="italic">D(u)</text>
<path d="M350 76H389" fill="none" stroke="#2c6d77" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="435" y="84" font-size="26" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-style="italic">y ∈ K</text>
</svg>
