<svg xmlns="http://www.w3.org/2000/svg" width="480" height="92" viewBox="0 20 480 92" role="img" aria-labelledby="title desc">
<title id="title">Training-based methods</title>
<desc id="desc">Constraint supervision adapts model parameters before generation. Supervision may concern output estimates, completed rollouts, population statistics, or an inference operation. A penalty alone does not enforce feasibility for each output.</desc>
