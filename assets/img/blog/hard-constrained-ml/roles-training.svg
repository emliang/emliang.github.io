<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="title desc">
<title id="title">Training-based approaches</title>
<desc id="desc">Classification schematic: constraints shape how the predictor is trained or constructed; the model directly returns y.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="160" fill="#ffffff"/>
<text x="12" y="71" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif">x</text>
<line x1="34" y1="62" x2="150" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="158" y="30" width="165" height="64" rx="9" fill="#24363a" stroke="#24363a" stroke-width="2"/>
<text x="240.5" y="54" font-size="25" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Model</text>
<text x="240.5" y="86" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">f<tspan dy="4.8" font-size="14.0">θ</tspan><tspan dy="-4.8">&#8203;</tspan>(x)</text>
<line x1="331" y1="62" x2="428" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="447" y="71" font-size="29" fill="#24363a" font-family="Georgia, 'Times New Roman', serif">y</text>
<text x="240" y="137" font-size="24" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Constraints shape the model</text>
</svg>
