<svg xmlns="http://www.w3.org/2000/svg" width="480" height="746" viewBox="0 0 480 746" role="img" aria-labelledby="title desc">
<title id="title">Physics-constrained flow matching corrects an endpoint estimate</title>
<desc id="desc">PCFM algorithm 1: shoot the learned flow forward from the current flow state to a terminal field estimate, apply Gauss–Newton constraint corrections, use optimal-transport interpolation involving the original prior draw x_0 to return to the next sampling time, and apply relaxed residual correction. Repeat and apply the final constraint solve as required at terminal time. The corrected object is a physical field. Local steps for nonlinear equalities reduce residuals; final enforcement depends on solve accuracy.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="746" fill="#ffffff"/>
<metadata>{&quot;source&quot;: &quot;https://arxiv.org/html/2506.04171v1#S3.SS3&quot;}</metadata>
<text x="240" y="27" font-size="24" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">PCFM: correct a terminal field estimate</text>
<rect x="148" y="53" width="316" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="306.0" y="78" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">x<tspan dy="6.72" font-size="19.6">t</tspan><tspan dy="-6.72">&#8203;</tspan></text>
<text x="306.0" y="109" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Flow state</text>
<line x1="306" y1="122" x2="306" y2="132" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="148" y="137" width="316" height="64" rx="9" fill="#e9f3f0" stroke="#9bbeb7" stroke-width="2"/>
<text x="306.0" y="161" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Predict terminal field</text>
<text x="306.0" y="193" font-size="20" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">ŷ = ODESolve(x<tspan dy="4.8" font-size="14.0">t</tspan><tspan dy="-4.8">&#8203;</tspan>, t, 1)</text>
<line x1="306" y1="206" x2="306" y2="216" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="148" y="221" width="316" height="64" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="306.0" y="245" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Gauss–Newton correction</text>
<text x="306.0" y="277" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">reduce h(ŷ) toward zero</text>
<line x1="306" y1="290" x2="306" y2="300" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="148" y="305" width="316" height="64" rx="9" fill="#e9f3f0" stroke="#9bbeb7" stroke-width="2"/>
<text x="306.0" y="329" font-size="25" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">OT interpolation</text>
<text x="306.0" y="361" font-size="20" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">to time t + Δt</text>
<line x1="306" y1="374" x2="306" y2="384" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="148" y="389" width="316" height="64" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="306.0" y="413" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Relaxed correction</text>
<text x="306.0" y="445" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">penalize endpoint residual</text>
<line x1="306" y1="458" x2="306" y2="468" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="148" y="473" width="316" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="306.0" y="498" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">x<tspan dy="6.72" font-size="19.6">t+Δt</tspan><tspan dy="-6.72">&#8203;</tspan></text>
<text x="306.0" y="529" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Next flow state</text>
<rect x="16" y="305" width="105" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="68.5" y="330" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">x<tspan dy="6.72" font-size="19.6">0</tspan><tspan dy="-6.72">&#8203;</tspan></text>
<text x="68.5" y="361" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">prior draw</text>
<line x1="128" y1="337" x2="140" y2="337" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="306" y="558" font-size="20" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Repeat until t = 1</text>
<line x1="16" y1="580" x2="464" y2="580" stroke="#dbe3e1" stroke-width="1"/>
<text x="240" y="610" font-size="23" fill="#24363a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">At terminal time</text>
<rect x="16" y="630" width="294" height="64" rx="9" fill="#f7eee8" stroke="#c79c86" stroke-width="2"/>
<text x="163.0" y="654" font-size="25" fill="#9b654e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Final constraint solve</text>
<text x="163.0" y="686" font-size="20" fill="#9b654e" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">to the required tolerance</text>
<line x1="318" y1="662" x2="358" y2="662" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="366" y="630" width="98" height="64" rx="9" fill="#ffffff" stroke="#c8d3d5" stroke-width="2"/>
<text x="415.0" y="655" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">y</text>
<text x="415.0" y="686" font-size="18" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">field</text>
<text x="240" y="723" font-size="22" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Local residual reduction ≠ a final solve.</text>
</svg>
