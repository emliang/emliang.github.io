<rect x="64" y="48" width="120" height="64" rx="5" fill="#f0f4f3" stroke="#c7d2cf" stroke-width="1"/>
<text x="124.0" y="72" font-size="22" fill="#637674" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Model</text>
<text x="124.0" y="99" font-size="23" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-style="italic">f<tspan dy="5.52" font-size="16.1">θ</tspan><tspan dy="-5.52">&#8203;</tspan>(x)</text>
