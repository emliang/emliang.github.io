<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="title desc">
<title id="title">Constraint parameterization</title>
<desc id="desc">Classification schematic: reference coordinates u are mapped by a specified feasible decoder D to output y.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6d77"/></marker>
  <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9b654e"/></marker>
</defs>
<rect width="480" height="160" fill="#ffffff"/>
<text x="12" y="71" font-size="28" fill="#24363a" font-family="Georgia, 'Times New Roman', serif">x</text>
<line x1="34" y1="62" x2="50" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="57" y="30" width="109" height="64" rx="9" fill="#24363a" stroke="#24363a" stroke-width="2"/>
<text x="111.5" y="54" font-size="25" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Model</text>
<text x="111.5" y="86" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">f<tspan dy="4.8" font-size="14.0">θ</tspan><tspan dy="-4.8">&#8203;</tspan>(x)</text>
<line x1="173" y1="62" x2="243" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="207" y="42" font-size="24" fill="#24363a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">u</text>
<rect x="251" y="30" width="161" height="64" rx="9" fill="#edf1f8" stroke="#91a5c5" stroke-width="2"/>
<text x="331.5" y="54" font-size="25" fill="#526e9b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">Decode</text>
<text x="331.5" y="86" font-size="20" fill="#526e9b" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">D(u)</text>
<line x1="419" y1="62" x2="434" y2="62" stroke="#2c6d77" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="447" y="71" font-size="29" fill="#24363a" font-family="Georgia, 'Times New Roman', serif">y</text>
<text x="240" y="137" font-size="23" fill="#586a6d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Coordinates construct a feasible output</text>
</svg>
