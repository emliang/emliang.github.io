<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">From a candidate to a feasible output</title>
  <desc id="desc">A copper candidate lies outside a green triangular feasible set. A perpendicular arrow returns it to the budget boundary, where a green diamond marks the feasible output.</desc>
  <metadata>Conceptual cover. K={(x,y): x&gt;=0, y&gt;=0, x+y&lt;=1}. Candidate=(0.8,0.8); Euclidean projection=(0.5,0.5). The coordinate axes have equal scale. This illustrates output correction, not a guarantee shared by all constrained-learning methods.</metadata>
  <defs>
    <marker id="return-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#a66b50" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="map-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2c6d77" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="400" fill="#fbfaf8"/>
